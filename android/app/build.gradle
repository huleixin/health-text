plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.couplehealth.app'
    compileSdk 34

    // Read Web URLs from gradle.properties, with safe fallbacks.
    // Defined before defaultConfig/buildTypes so they are available in all closures.
    def webUrlDebug = project.findProperty("APP_WEB_URL_DEBUG") ?: "file:///android_asset/web/index.html"
    def webUrlRelease = project.findProperty("APP_WEB_URL_RELEASE") ?: "https://your-cloudflare-pages-url.pages.dev"

    defaultConfig {
        applicationId "com.couplehealth.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // API base URL: used by NativeBridge.getApiBaseUrl() when web content is loaded
        // from file:// (debug build). Always points to the production HTTPS domain so
        // fetch('/api/*') resolves correctly in the Android WebView.
        buildConfigField "String", "WEB_API_BASE_URL", "\"${webUrlRelease}\""
    }

    buildTypes {
        debug {
            // Debug loads the bundled web app by default — instantly testable APK.
            buildConfigField "String", "WEB_APP_URL", "\"${webUrlDebug}\""
            buildConfigField "boolean", "WEB_DEBUG_ENABLED", "true"
            buildConfigField "boolean", "IS_RELEASE", "false"
        }
        release {
            // Release loads the formal HTTPS deployment (auto-updates via Cloudflare Pages).
            buildConfigField "String", "WEB_APP_URL", "\"${webUrlRelease}\""
            buildConfigField "boolean", "WEB_DEBUG_ENABLED", "false"
            buildConfigField "boolean", "IS_RELEASE", "true"
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing: configure via keystore.properties (see README). Falls back to debug
            // signing so `assembleRelease` still works for testing; replace before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
