# ===== Project-wide Gradle properties =====
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ===== Web App URL configuration =====
# Both Debug and Release load the formal Cloudflare Pages HTTPS URL.
# Web updates: Git push -> Cloudflare auto-deploy -> App auto-uses new version (no APK rebuild).
# Local assets in app/src/main/assets/web/ are kept as fallback but not loaded by default.
APP_WEB_URL_DEBUG=https://healthbb.pages.dev

# Release uses the same formal HTTPS URL.
APP_WEB_URL_RELEASE=https://healthbb.pages.dev

# ===== Release signing (DO NOT commit real values) =====
# Configure these via local.properties or a separate signing config file before release.
